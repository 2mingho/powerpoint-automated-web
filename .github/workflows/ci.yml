name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    name: Tests y migraciones
    runs-on: ubuntu-24.04

    env:
      SECRET_KEY: ci-secret-key-not-used-in-production
      FLASK_ENV: development
      ALLOW_SELF_REGISTRATION: 'false'
      APP_TZ: America/Santo_Domingo

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest ruff

      - name: Lint (no bloquea todavia)
        continue-on-error: true
        run: ruff check .

      - name: Tests
        run: pytest tests/ -q

      # Verifica que las migraciones reproducen exactamente lo que declara
      # models.py. Si alguien anade una columna y olvida la migracion, el
      # autogenerate detecta la diferencia y este paso falla.
      - name: Las migraciones coinciden con los modelos
        env:
          FLASK_APP: app.py
          SKIP_STARTUP_TASKS: '1'
          SQLALCHEMY_DATABASE_URI: sqlite:///ci_migrations.db
        run: |
          flask db upgrade
          flask db migrate -m "deteccion de deriva" 2>&1 | tee migrate.log
          if grep -q "No changes in schema detected" migrate.log; then
            echo "OK: el esquema migrado coincide con models.py"
          else
            echo "FALLO: hay diferencias entre las migraciones y models.py"
            grep -i "detected" migrate.log || true
            exit 1
          fi

  web:
    name: Web (Next.js)
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    # Alembic (Flask) es el dueño del esquema: la base se construye con sus
    # migraciones y Prisma solo la lee. Si schema.prisma y las migraciones se
    # separan, el paso de deriva falla antes de llegar a las pruebas.
    services:
      postgres:
        # Espejo oficial en AWS ECR Public: Docker Hub limita las descargas anonimas y a veces no responde.
        image: public.ecr.aws/docker/library/postgres:16
        env:
          POSTGRES_USER: newlink
          POSTGRES_PASSWORD: newlink_dev
          POSTGRES_DB: newlink_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U newlink -d newlink_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      DATABASE_URL: postgresql://newlink:newlink_dev@127.0.0.1:5432/newlink_ci
      # Mismo valor en el servidor y en Playwright: las pruebas sellan sus propias sesiones.
      SESSION_SECRET: ci-session-secret-solo-para-pruebas-0123456789
      # ANALYTICS_URL es la raiz de Flask, sin /api/interno.
      ANALYTICS_URL: http://127.0.0.1:5101
      ANALYTICS_TOKEN: ci-analytics-token-no-es-de-produccion
      BASE_URL: http://127.0.0.1:3301

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Esquema desde cero con las migraciones de Alembic
        env:
          SECRET_KEY: ci-secret-key-not-used-in-production
          FLASK_APP: app.py
          FLASK_ENV: development
          SKIP_STARTUP_TASKS: '1'
          APP_TZ: America/Santo_Domingo
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          flask db upgrade

      - name: Dependencias y cliente de Prisma
        working-directory: web
        run: |
          npm ci
          npm run db:generate

      - name: schema.prisma coincide con la base migrada
        working-directory: web
        run: npx prisma migrate diff --config prisma7.config.ts --from-config-datasource --to-schema prisma/schema.prisma --exit-code

      - name: Typecheck
        working-directory: web
        run: npm run typecheck

      - name: Lint
        working-directory: web
        run: npm run lint

      - name: Pruebas unitarias
        working-directory: web
        run: npm test

      - name: Build
        working-directory: web
        run: npm run build

      - name: Servicio de analisis (Flask) y servidor Next.js
        env:
          SECRET_KEY: ci-secret-key-not-used-in-production
          FLASK_ENV: development
          SKIP_STARTUP_TASKS: '1'
          APP_TZ: America/Santo_Domingo
        run: |
          flask --app app run -p 5101 > flask.log 2>&1 &
          (cd web && npx next start -p 3301 > ../next.log 2>&1) &
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:5101/healthz >/dev/null && curl -fsS http://127.0.0.1:3301/login >/dev/null; then
              echo "servidores listos"; exit 0
            fi
            sleep 1
          done
          echo "los servidores no arrancaron"; tail -n 40 flask.log next.log; exit 1

      - name: Navegador de Playwright
        working-directory: web
        run: npx playwright install --with-deps chromium

      # globalSetup siembra la base una vez (e2e/semilla.ts) y vacia lo que
      # hubiera: es una base efimera del job, nunca la de desarrollo.
      - name: E2E (todas las baterias, un solo worker)
        working-directory: web
        run: npx playwright test

      # La imagen que se despliega: se construye y se arranca contra la base ya migrada.
      # /healthz debe decir que la base responde y que el esquema es el que espera el codigo.
      - name: Imagen de Docker de la web y su /healthz
        run: |
          docker build -t newlink-web:ci web/
          docker run -d --name web-ci --network host -e PORT=3401 -e DATABASE_URL="$DATABASE_URL" -e SESSION_SECRET="$SESSION_SECRET" newlink-web:ci
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:3401/healthz >/dev/null 2>&1 && break; sleep 2; done
          curl -fsS http://127.0.0.1:3401/healthz | tee healthz.json
          grep -q '"schema":"ok"' healthz.json
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3401/login)" = "200"
          test "$(curl -s -o /dev/null -w '%{http_code}' 'http://127.0.0.1:3401/_next/image?url=%2Flogo-newlink.png&w=64&q=75')" = "200"
          docker rm -f web-ci

      - name: Registros de la imagen si algo falla
        if: failure()
        run: docker logs web-ci 2>&1 | tail -n 60 || true

      - name: Trazas y registros si algo falla
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: diagnostico-web
          path: |
            web/test-results
            flask.log
            next.log
          if-no-files-found: ignore
          retention-days: 7
